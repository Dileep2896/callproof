[project]
name = "callproof"
version = "0.1.0"
description = "Post-call audit and regression gate for insurance voice agents: grounding against the rated quote, disclosure timing, intake completeness."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2.8", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["callproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["C408"]
